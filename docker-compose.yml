# ─────────────────────────────────────────────────────────────────────────────
# Local demo of the "separate repos, shared schema" pattern.
#
#   docker compose up --build
#
# Boot order demonstrates the two hard rules:
#   1. `migrate` (the schema-package image) is the ONLY thing that runs
#      `prisma migrate deploy`. It applies pending migrations and exits.
#   2. `service-a/b/c` wait for the migration to succeed, then start. They run
#      no migrations of their own — only `prisma generate` + build.
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # demo only — use a secret in real life
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: schema-package/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    # Runs `prisma migrate deploy` once (the image's default CMD) and exits.

  service-a:
    build:
      context: .
      dockerfile: service-a/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      PORT: "3001"
      SERVICE_NAME: service-a
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3001"

  service-b:
    build:
      context: .
      dockerfile: service-b/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      PORT: "3002"
      SERVICE_NAME: service-b
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3002:3002"

  service-c:
    build:
      context: .
      dockerfile: service-c/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      PORT: "3003"
      SERVICE_NAME: service-c
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3003:3003"

volumes:
  db-data:
